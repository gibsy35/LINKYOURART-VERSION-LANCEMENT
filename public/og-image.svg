<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f5c842"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glows -->
  <circle cx="200" cy="200" r="300" fill="#00d4ff" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="1000" cy="430" r="350" fill="#a78bfa" opacity="0.06" filter="url(#blur2)"/>
  <circle cx="600" cy="315" r="200" fill="#f5c842" opacity="0.03" filter="url(#blur1)"/>

  <!-- Grille décorative -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Bande gradient top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyan-violet)"/>

  <!-- Badge VIP -->
  <rect x="80" y="60" width="100" height="32" rx="16" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <text x="130" y="81" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#00d4ff" text-anchor="middle" letter-spacing="2">✦ VIP</text>

  <!-- Logo LINKYOURART -->
  <text x="80" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">LINKYOURART</text>

  <!-- Ligne décorative sous le logo -->
  <rect x="80" y="216" width="480" height="2" fill="url(#cyan-violet)" rx="1"/>

  <!-- Phrase signature -->
  <text x="80" y="280" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.45" font-style="italic">"Ce que vous créez aujourd'hui peut appartenir</text>
  <text x="80" y="310" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.45" font-style="italic">à mille personnes demain."</text>

  <!-- Badges univers créatifs -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700">
    <!-- Music -->
    <rect x="80" y="360" width="90" height="30" rx="15" fill="#00d4ff" opacity="0.12"/>
    <rect x="80" y="360" width="90" height="30" rx="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <text x="125" y="380" fill="#00d4ff" text-anchor="middle" letter-spacing="1">MUSIC</text>
    <!-- Film -->
    <rect x="182" y="360" width="80" height="30" rx="15" fill="#a78bfa" opacity="0.12"/>
    <rect x="182" y="360" width="80" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <text x="222" y="380" fill="#a78bfa" text-anchor="middle" letter-spacing="1">FILM</text>
    <!-- Fashion -->
    <rect x="274" y="360" width="100" height="30" rx="15" fill="#f5c842" opacity="0.12"/>
    <rect x="274" y="360" width="100" height="30" rx="15" fill="none" stroke="#f5c842" stroke-width="1" opacity="0.4"/>
    <text x="324" y="380" fill="#f5c842" text-anchor="middle" letter-spacing="1">FASHION</text>
    <!-- Gaming -->
    <rect x="386" y="360" width="100" height="30" rx="15" fill="#00d4ff" opacity="0.12"/>
    <rect x="386" y="360" width="100" height="30" rx="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <text x="436" y="380" fill="#00d4ff" text-anchor="middle" letter-spacing="1">GAMING</text>
    <!-- TV Series -->
    <rect x="498" y="360" width="110" height="30" rx="15" fill="#a78bfa" opacity="0.12"/>
    <rect x="498" y="360" width="110" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <text x="553" y="380" fill="#a78bfa" text-anchor="middle" letter-spacing="1">TV SERIES</text>
  </g>

  <!-- Stats LYA -->
  <g>
    <!-- LYA Score -->
    <rect x="80" y="430" width="180" height="80" rx="12" fill="#ffffff" opacity="0.04"/>
    <rect x="80" y="430" width="180" height="80" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
    <text x="170" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#a78bfa" text-anchor="middle" letter-spacing="2" opacity="0.8">LYA SCORE</text>
    <text x="170" y="494" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="900" fill="#a78bfa" text-anchor="middle">/1000</text>

    <!-- LYA Unit -->
    <rect x="274" y="430" width="180" height="80" rx="12" fill="#ffffff" opacity="0.04"/>
    <rect x="274" y="430" width="180" height="80" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
    <text x="364" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#f5c842" text-anchor="middle" letter-spacing="2" opacity="0.8">LYA UNIT</text>
    <text x="364" y="494" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="900" fill="#f5c842" text-anchor="middle">$50</text>

    <!-- Pionniers -->
    <rect x="468" y="430" width="180" height="80" rx="12" fill="#ffffff" opacity="0.04"/>
    <rect x="468" y="430" width="180" height="80" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
    <text x="558" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#00d4ff" text-anchor="middle" letter-spacing="2" opacity="0.8">PIONNIERS</text>
    <text x="558" y="494" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="900" fill="#00d4ff" text-anchor="middle">1 420+</text>
  </g>

  <!-- Visuel droite - Cercles concentriques -->
  <g transform="translate(920, 315)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.06"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.08"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.12"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.15"/>
    <circle cx="0" cy="0" r="30" fill="#00d4ff" opacity="0.08"/>
    <text x="0" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="900" fill="#00d4ff" text-anchor="middle" opacity="0.9">✦</text>

    <!-- Nœuds connectés -->
    <g opacity="0.5">
      <circle cx="0" cy="-150" r="8" fill="#a78bfa"/>
      <circle cx="130" cy="-75" r="6" fill="#00d4ff"/>
      <circle cx="130" cy="75" r="8" fill="#f5c842"/>
      <circle cx="0" cy="150" r="6" fill="#a78bfa"/>
      <circle cx="-130" cy="75" r="8" fill="#00d4ff"/>
      <circle cx="-130" cy="-75" r="6" fill="#f5c842"/>
    </g>
    <!-- Lignes de connexion -->
    <g stroke="#00d4ff" stroke-width="1" opacity="0.15">
      <line x1="0" y1="-30" x2="0" y2="-150"/>
      <line x1="0" y1="-30" x2="130" y2="-75"/>
      <line x1="0" y1="-30" x2="130" y2="75"/>
      <line x1="0" y1="30" x2="0" y2="150"/>
      <line x1="0" y1="30" x2="-130" y2="75"/>
      <line x1="0" y1="30" x2="-130" y2="-75"/>
    </g>
  </g>

  <!-- URL -->
  <text x="80" y="590" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#ffffff" opacity="0.25" letter-spacing="1">linkyourart.com</text>

  <!-- Bande gradient bas -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#cyan-violet)"/>
</svg>
