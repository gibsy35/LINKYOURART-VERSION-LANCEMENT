<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── TITLE & SEO ──────────────────────────────────────────── -->
    <title>LinkYourArt — Ce que vous créez aujourd'hui peut être reconnu par des milliers de personnes demain</title>
    <meta name="description" content="LinkYourArt (LYA) — The first creative certification standard. Certify artistic projects, support creators, follow the LYA Score. Music, Film, Fashion, Architecture, Gaming, TV Series." />
    <meta name="keywords" content="LinkYourArt, LYA, certification créative, droits créatifs, mécénat artistique, LYA Score, art, musique, cinéma, mode, gaming" />
    <meta name="author" content="LinkYourArt" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://linkyourart.com" />

    <!-- ── FAVICONS ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="msapplication-TileColor" content="#0D1117" />

    <!-- ── iOS "ADD TO HOME SCREEN" ──────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LYA" />

    <!-- ── OPEN GRAPH (LinkedIn, Facebook, WhatsApp) ─────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linkyourart.com" />
    <meta property="og:title" content="LinkYourArt — ART NEEDS A STANDARD" />
    <meta property="og:description" content="What you create today can be recognized by thousands tomorrow. The first creative certification standard — for creators, patrons and professionals worldwide." />
    <meta property="og:image" content="https://linkyourart.com/og-image.png?v=1782282993" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="LinkYourArt — ART NEEDS A STANDARD" />
    <meta property="og:site_name" content="LinkYourArt" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- ── TWITTER / X CARD ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LinkYourArt" />
    <meta name="twitter:creator" content="@LinkYourArt" />
    <meta name="twitter:title" content="LinkYourArt — ART NEEDS A STANDARD" />
    <meta name="twitter:description" content="The first creative certification standard. Certify artistic projects, support creators, follow the LYA Score. Music · Film · Fashion · Gaming · Architecture · TV Series." />
    <meta name="twitter:image" content="https://linkyourart.com/og-image.png?v=1782282993" />
    <meta name="twitter:image:alt" content="LinkYourArt — ART NEEDS A STANDARD" />

    <!-- ── LINKEDIN SPECIFIC ─────────────────────────────────────── -->
    <meta property="og:image:secure_url" content="https://linkyourart.com/og-image.png?v=1782282993" />

    <!-- ── STRUCTURED DATA ───────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LinkYourArt",
      "alternateName": "LYA",
      "url": "https://linkyourart.com",
      "description": "The first creative certification standard. Certify artistic projects and follow their LYA Score.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://linkyourart.com?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── CRITICAL CSS: intro overlay ──────────────────────────────
         Duplicated inline so the entry animation is correctly
         fixed/full-screen/on-top from the very first paint, even on a
         cold load where the external Tailwind stylesheet hasn't
         finished downloading yet. Without this, the overlay can
         briefly render unstyled (in normal document flow instead of
         a fixed full-screen layer) before the stylesheet applies —
         visible as the intro looking "stuck in the background" on
         first visit, but correct on any subsequent (cached) load. -->
    <style>
      .fixed { position: fixed; }
      .inset-0 { inset: 0px; }
      .z-\[200\] { z-index: 200; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
