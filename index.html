<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── TITLE & SEO ──────────────────────────────────────────── -->
    <title>LinkYourArt — Ce que vous créez aujourd'hui peut appartenir à mille personnes demain</title>
    <meta name="description" content="LinkYourArt (LYA) est la première plateforme de co-propriété créative. Soutenez des projets artistiques, percevez des revenus, échangez des LYA Units. Musique, Cinéma, Mode, Architecture, Gaming, TV Series." />

    <meta name="author" content="LinkYourArt" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://linkyourart.com" />

    <!-- ── FAVICONS ──────────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="msapplication-TileColor" content="#0D1117" />

    <!-- ── OPEN GRAPH (LinkedIn, Facebook, WhatsApp) ─────────────── -->

    <meta property="og:url" content="https://linkyourart.com" />
    <meta property="og:title" content="LinkYourArt — ART IS AN EXCHANGE" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkYourArt — ART IS AN EXCHANGE" />
    <meta property="og:site_name" content="LinkYourArt" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- ── TWITTER / X CARD ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LinkYourArt" />
    <meta name="twitter:creator" content="@LinkYourArt" />
    <meta name="twitter:title" content="LinkYourArt — ART IS AN EXCHANGE" />
    <meta name="twitter:description" content="The first creative co-ownership platform. Support artistic projects, earn revenues, exchange LYA Units. Music · Film · Fashion · Gaming · Architecture · TV Series." />
    <meta name="twitter:image" content="https://linkyourart.com/og-image.png" />
    <meta name="twitter:image:alt" content="LinkYourArt — ART IS AN EXCHANGE" />

    <meta property="og:image:secure_url" content="https://linkyourart.com/og-image.png" />

    <!-- ── STRUCTURED DATA ───────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LinkYourArt",
      "alternateName": "LYA",
      "url": "https://linkyourart.com",
      "description": "The first creative co-ownership platform. Support artistic projects and earn revenues through LYA Units.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://linkyourart.com?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
